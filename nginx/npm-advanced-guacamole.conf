# Cole no NPM: Proxy Host do seu domínio → aba "Advanced" → Custom Nginx Configuration
# Troque "acesso" se você mudou GUAC_PATH no .env (os dois precisam ser iguais).

location /acesso/ {
    # Resolve o nome do contêiner a cada requisição (DNS interno do Docker).
    # Assim o NPM não deixa de subir se o Guacamole estiver parado.
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $guac_upstream http://guacamole:8080;
    proxy_pass $guac_upstream;             # sem URI: mantém /acesso/ na URL
    proxy_http_version 1.1;
    proxy_buffering off;                   # obrigatório para o túnel do Guacamole

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # WebSocket
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection $http_connection;

    # Sessões RDP longas não caem por inatividade do proxy
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    client_max_body_size 1g;               # upload de arquivos pela sessão
    access_log off;                        # o Guacamole já registra o histórico
}

# Quem digitar só /acesso vai para /acesso/
location = /acesso {
    return 301 /acesso/;
}
